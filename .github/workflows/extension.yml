name: Browser extension
'on':
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:extension
      - run: npm run lint:extension
      - run: npm run build:extension
      # The artifact is the unpacked extension: download, unzip, then "Load unpacked".
      - uses: actions/upload-artifact@v4
        with:
          name: contember-request-inspector
          path: build-extension
          if-no-files-found: error
